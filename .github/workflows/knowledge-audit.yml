name: Knowledge audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Generate knowledge baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependency
        run: python -m pip install "PyYAML==6.0.3"
      - name: Test knowledge tools
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Generate inventory and audit reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/knowledge-audit
          git rev-parse HEAD > site/knowledge-audit/commit.txt
          python --version > site/knowledge-audit/python.txt
          python tools/validate_all.py | tee site/knowledge-audit/structural.txt
          python tools/validate_semantics.py | tee site/knowledge-audit/semantic.txt
          python tools/find_orphans.py | tee site/knowledge-audit/orphans.txt
          python tools/audit_inventory.py --output site/knowledge-audit/inventory.json
          python tools/audit_knowledge.py --output site/knowledge-audit/KNOWLEDGE_AUDIT.md --json-output site/knowledge-audit/knowledge_audit.json | tee site/knowledge-audit/domains.txt
          python tools/extract_recipe_metadata.py --output site/knowledge-audit/recipe_metadata.json | tee site/knowledge-audit/recipe_metadata_summary.txt
          python tools/report_recipe_coverage.py --input site/knowledge-audit/recipe_metadata.json --output site/knowledge-audit/recipe_coverage.json | tee site/knowledge-audit/recipe_coverage_summary.txt
      - name: Build and contrast recipe index
        shell: bash
        run: |
          set -euo pipefail
          dir=site/knowledge-audit
          python tools/build_recipe_index.py --input "$dir/recipe_metadata.json" --output "$dir/recipe_index.json"
          python tools/build_recipe_index.py --input "$dir/recipe_metadata.json" --output "$dir/recipe_index_repeat.json"
          python tools/audit_recipe_index.py --projection "$dir/recipe_metadata.json" --index "$dir/recipe_index.json" --repeat "$dir/recipe_index_repeat.json" --output "$dir/recipe_index_audit.json"
          rm "$dir/recipe_index_repeat.json"
      - name: Build and contrast Culinary Explorer projection
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_site_docs.py --without-explorer
          dir=site/knowledge-audit
          python tools/build_culinary_explorer.py --index "$dir/recipe_index.json" --docs site_docs --output "$dir/culinary_explorer.json"
          python tools/build_culinary_explorer.py --index "$dir/recipe_index.json" --docs site_docs --output "$dir/culinary_explorer_repeat.json"
          cmp "$dir/culinary_explorer.json" "$dir/culinary_explorer_repeat.json"
          rm "$dir/culinary_explorer_repeat.json"
      - name: Build and contrast Recipe Assistant data
        shell: bash
        run: |
          set -euo pipefail
          dir=site/knowledge-audit
          python tools/build_recipe_assistant.py --index "$dir/recipe_index.json" --docs site_docs --output "$dir/recipe_assistant"
          python tools/build_recipe_assistant.py --index "$dir/recipe_index.json" --docs site_docs --output "$dir/recipe_assistant_repeat"
          diff -qr "$dir/recipe_assistant" "$dir/recipe_assistant_repeat"
          rm -r "$dir/recipe_assistant_repeat"
      - name: Set up Node for Explorer contrast
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Culinary Pantry UI syntax
        run: node --check assets/culinary-pantry-ui.mjs
      - name: Test Culinary Pantry transfer
        run: node --test tools/test_culinary_pantry_transfer.mjs
      - name: Test Culinary Pantry persistence
        run: node --test tools/test_culinary_pantry_persistence.mjs
      - name: Check Culinary Shopping UI syntax
        run: node --check assets/culinary-shopping-ui.mjs
      - name: Test Culinary Shopping recipe selection
        run: node --test tools/test_culinary_shopping_recipe_transfer.mjs
      - name: Test Culinary Shopping Pantry coordinator
        run: node --test tools/test_culinary_shopping_pantry_coordinator.mjs
      - name: Test Culinary Shopping persistence
        run: node --test tools/test_culinary_shopping_persistence.mjs
      - name: Test Culinary Planner persistence
        run: node --test tools/test_culinary_planner_persistence.mjs
      - name: Test Culinary Planner model
        run: node --test tools/test_culinary_planner_model.mjs
      - name: Test Culinary Shopping model
        run: node --test tools/test_culinary_shopping_model.mjs
      - name: Test Culinary Pantry model
        run: node --test tools/test_culinary_pantry_model.mjs
      - name: Test Recipe Assistant cooking session
        run: node --test tools/test_recipe_assistant_session.mjs
      - name: Check Recipe Assistant UI syntax
        run: node --check assets/recipe-assistant-ui.mjs
      - name: Check Culinary Explorer UI syntax
        run: node --check assets/culinary-explorer-ui.mjs
      - name: Contrast Culinary Explorer search
        run: python tools/evaluate_culinary_explorer.py --index site/knowledge-audit/recipe_index.json --catalog site/knowledge-audit/culinary_explorer.json --output site/knowledge-audit/culinary_explorer_search.json
      - name: Evaluate recipe queries
        run: python tools/evaluate_recipe_queries.py --index site/knowledge-audit/recipe_index.json --output site/knowledge-audit/recipe_query_evaluation.json
      - name: Experiment with textual retrieval
        run: python tools/experiment_retrieval_text.py --output site/knowledge-audit/retrieval_text_experiment.json
      - name: Experiment with ingredient identity
        run: python tools/experiment_retrieval_identity.py --output site/knowledge-audit/retrieval_identity_experiment.json
      - name: Contrast integrated terms retrieval
        run: python tools/evaluate_recipe_terms.py --index site/knowledge-audit/recipe_index.json --output site/knowledge-audit/recipe_terms_evaluation.json
      - name: Experiment with culinary compatibility
        run: python tools/experiment_culinary_compatibility.py --output site/knowledge-audit/compatibility_experiment.json
      - name: Inventory culinary requirement signals
        run: python tools/audit_culinary_requirements.py --output site/knowledge-audit/culinary_requirements_inventory.json
      - name: Experiment with culinary requirements model
        run: python tools/experiment_culinary_requirements.py --output site/knowledge-audit/requirements_model_experiment.json
      - name: Experiment with requirements recognition
        run: python tools/experiment_requirements_recognition.py --output site/knowledge-audit/requirements_recognition_experiment.json
      - name: Upload baseline reports
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-baseline-${{ github.sha }}
          path: site/knowledge-audit/
          if-no-files-found: error
          retention-days: 30
