name: Knowledge integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-knowledge:
    name: Validate Markdown knowledge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install "PyYAML==6.0.3"

      - name: Validate Front Matter, IDs and links
        run: python tools/validate_all.py

      - name: Audit semantic relationships (advisory)
        run: python tools/validate_semantics.py

      - name: Report orphan knowledge (advisory)
        run: python tools/find_orphans.py
