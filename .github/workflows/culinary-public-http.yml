name: Culinary Public HTTP Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public HTTP pages and resources (read-only)
        run: |
          python tools/check_culinary_public_http.py --base-url https://fran-eliot.github.io/NovaCoquinaria/ --output /tmp/culinary-public-http.json
      - name: Upload public HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: culinary-public-http-evidence
          path: /tmp/culinary-public-http.json
          if-no-files-found: error
